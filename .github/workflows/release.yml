name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require tag on current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test and vet server
        working-directory: server
        run: |
          go test -race ./...
          go vet ./...
      - name: Build server container
        run: docker build --pull --tag lp3-whatsapp-bridge:release-test server
      - name: Repository privacy scan
        run: ./scripts/privacy-scan.sh .
      - name: Full-history secret scan
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: Shell and Compose syntax
        run: |
          bash -n scripts/*.sh
          cp .env.example .env
          docker compose config >/dev/null

  signed-apk:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Fetch pinned Light SDK
        run: |
          git clone https://github.com/lightphone/light-sdk.git sdk
          git -C sdk checkout --detach 522f94d5e862bd8824b43f3dfc76221105b720d5
          rsync -a --delete tool/ sdk/tool/
      - name: Build unsigned release APK
        working-directory: sdk
        run: ./gradlew --no-daemon --build-cache :tool:testDebugUnitTest :tool:lintRelease :tool:assembleRelease -DlightSdk.unsigned=true
      - name: Restore protected release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Sign and verify
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unsigned=$(find sdk/tool/build/outputs/apk/release -name '*.apk' -type f -print -quit)
          test -n "$unsigned"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "env:STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --out lp3-whatsapp-bridge.apk \
            "$unsigned"
          "$apksigner" verify --verbose --print-certs lp3-whatsapp-bridge.apk
      - name: Scan release APK
        run: ./scripts/scan-apk.sh lp3-whatsapp-bridge.apk
      - name: Write checksum
        run: sha256sum lp3-whatsapp-bridge.apk > lp3-whatsapp-bridge.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=(--generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" lp3-whatsapp-bridge.apk lp3-whatsapp-bridge.apk.sha256 "${release_flags[@]}"
